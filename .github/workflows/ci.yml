name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test
      # Lint is intentionally NON-BLOCKING: the repo carries pre-existing
      # ESLint style debt slated for incremental burndown. Errors surface
      # here but must not gate merge until the debt clears. Restore this as
      # a required step once `npm run lint` is green.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
