<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Trace API Sandbox</title>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
		/>
		<style>
			* { box-sizing: border-box; margin: 0; padding: 0; }
			body {
				font-family: monospace;
				padding: 2rem;
				max-width: 900px;
				margin: 0 auto;
				background: #1e1e1e;
				color: #d4d4d4;
			}
			h1 { font-size: 1.2rem; margin-bottom: 0.3rem; color: #9cdcfe; }
			.hint { font-size: 12px; color: #808080; margin-bottom: 1rem; }
			.controls { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
			button {
				padding: 0.4rem 1rem;
				font-family: monospace;
				font-size: 13px;
				cursor: pointer;
				border: 1px solid #464647;
				background: #2d2d30;
				color: #d4d4d4;
			}
			button:hover { background: #365f88; }
			button:disabled { opacity: 0.4; cursor: not-allowed; }
			#editor {
				border: 1px solid #464647;
				border-radius: 2px;
				padding: 0.75rem;
				min-height: 350px;
				font-family: monospace;
				font-size: 14px;
				line-height: 1.5;
				tab-size: 4;
				background: #1e1e1e;
				color: #d4d4d4;
				overflow: auto;
			}
			#status {
				font-size: 12px;
				color: #808080;
				margin-top: 0.4rem;
			}
			#status.error { color: #f48771; }
		</style>
	</head>
	<body>
		<h1>Trace API Sandbox</h1>
		<p class="hint">
			Write code that calls trace(code, config). Output goes to DevTools
			console. Available globals: trace, format.
		</p>

		<div class="controls">
			<button type="button" id="btn-run">[Run]</button>
			<button type="button" id="btn-reset">[Reset]</button>
		</div>

		<div id="editor"></div>
		<div id="status"></div>

		<script type="module">
			import { CodeJar } from 'https://esm.sh/codejar@4.2.0';
			import hljs from 'https://esm.sh/highlight.js@11.9.0/lib/core';
			import javascript from 'https://esm.sh/highlight.js@11.9.0/lib/languages/javascript';
			import trace from './trace.ts';
			import { format } from './format.ts';

			hljs.registerLanguage('javascript', javascript);

			const SAMPLE = `// --- Batch mode: await the full result ---

const code = \`let x = 5;
let y = x + 1;
console.log(y);
\`;

const result = await trace(code, { seconds: 5 });

console.log('ok:', result.ok);
console.log('events:', result.logs?.length);
console.log('full result:', result);

// --- Streaming mode (uncomment to try) ---
// for await (const event of trace(code, { seconds: 5 })) {
//   console.log(event.category, event);
// }
`;

			// --- Editor ---

			const editorEl = document.getElementById('editor');
			const statusEl = document.getElementById('status');

			function highlight(el) {
				hljs.highlightElement(el);
			}

			const jar = CodeJar(editorEl, highlight, { tab: '\t' });
			jar.updateCode(SAMPLE);

			// --- Run ---

			const AsyncFunction = Object.getPrototypeOf(
				async function () {},
			).constructor;

			document
				.getElementById('btn-run')
				.addEventListener('click', async function onRun() {
					const btn = document.getElementById('btn-run');
					btn.disabled = true;
					statusEl.className = '';
					statusEl.textContent = 'running\u2026';

					try {
						const fn = new AsyncFunction('trace', 'format', jar.toString());
						await fn(trace, format);
						statusEl.textContent = 'done \u2014 check DevTools console';
					} catch (err) {
						statusEl.className = 'error';
						statusEl.textContent = 'error: ' + err.message;
						console.error(err);
					} finally {
						btn.disabled = false;
					}
				});

			// --- Reset ---

			document
				.getElementById('btn-reset')
				.addEventListener('click', function onReset() {
					jar.updateCode(SAMPLE);
					statusEl.className = '';
					statusEl.textContent = '';
				});

			// --- SAB check ---

			if (typeof SharedArrayBuffer === 'undefined') {
				statusEl.className = 'error';
				statusEl.textContent =
					'SharedArrayBuffer not available \u2014 trace will not work. Check COOP/COEP headers.';
			}
		</script>
	</body>
</html>
