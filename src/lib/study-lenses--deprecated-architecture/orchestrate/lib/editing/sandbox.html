<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Editor Sandbox</title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			body {
				font-family: monospace;
				padding: 2rem;
				max-width: 900px;
				margin: 0 auto;
				background: #1e1e1e;
				color: #d4d4d4;
			}
			h1 {
				font-size: 1.2rem;
				margin-bottom: 0.5rem;
				color: #9cdcfe;
			}
			p.hint {
				font-size: 13px;
				color: #808080;
				margin-bottom: 1rem;
			}
			.controls {
				display: flex;
				gap: 0.5rem;
				flex-wrap: wrap;
				align-items: center;
				margin-bottom: 0.5rem;
			}
			button {
				padding: 0.4rem 1rem;
				font-family: monospace;
				font-size: 13px;
				cursor: pointer;
				border: 1px solid #464647;
				background: #2d2d30;
				color: #d4d4d4;
			}
			button:hover {
				background: #365f88;
			}
			button:disabled {
				opacity: 0.4;
				cursor: not-allowed;
			}
			select {
				padding: 0.4rem;
				font-family: monospace;
				font-size: 13px;
				border: 1px solid #464647;
				background: #2d2d30;
				color: #d4d4d4;
			}
			.separator {
				width: 1px;
				height: 1.5em;
				background: #464647;
			}
			#editor-container {
				border: 1px solid #464647;
				margin-bottom: 1rem;
				min-height: 300px;
			}
			#editor-container .cm-editor {
				height: 300px;
			}
			#log {
				border: 1px solid #464647;
				padding: 0.5rem;
				max-height: 400px;
				overflow-y: auto;
				font-size: 12px;
				white-space: pre-wrap;
				background: #252526;
				display: none;
			}
			.log-info {
				color: #4ec9b0;
			}
			.log-warn {
				color: #f48771;
			}
			.log-error {
				color: #f44747;
			}
			.log-check {
				color: #dcdcaa;
			}
			.log-format {
				color: #9cdcfe;
			}
			.log-content {
				color: #ce9178;
			}
			.log-event {
				color: #b5cea8;
			}
			#status {
				font-size: 12px;
				color: #808080;
				margin-top: 0.3rem;
			}
		</style>
	</head>
	<body>
		<h1>Editor Sandbox</h1>
		<p class="hint">
			Hover JS keywords for docs. Type for completions (try 'va' for
			the blocked-item demo — appears in popup with explanation,
			Enter dismisses without inserting). Cmd/Ctrl-Shift-F to
			format. JeJ violations appear as red markers in the gutter.
		</p>

		<div class="controls">
			<label
				>language:
				<select id="language">
					<option value="javascript" selected>JavaScript</option>
					<option value="typescript">TypeScript</option>
					<option value="python">Python</option>
					<option value="html">HTML</option>
					<option value="css">CSS</option>
					<option value="json">JSON</option>
					<option value="markdown">Markdown</option>
					<option value="plaintext">Plain Text</option>
				</select></label
			>
			<button type="button" id="btn-format">[format]</button>
			<button type="button" id="btn-reset">[reset]</button>
			<button type="button" id="btn-content">[get content]</button>

			<div class="separator"></div>

			<button type="button" id="btn-validate">[validate]</button>
			<button type="button" id="btn-run">[run]</button>
			<button type="button" id="btn-trace">[trace]</button>
			<button type="button" id="btn-debug">[debug]</button>

			<div class="separator"></div>

			<button type="button" id="btn-destroy">[destroy]</button>
			<button type="button" id="btn-recreate">[recreate]</button>
		</div>

		<div id="editor-container"></div>
		<div id="status"></div>
		<div id="log"></div>

		<script type="module">
			import createEditor from './create-editor.ts';
			import format from '../formatting/format.ts';
			import validate from '../validating/validate.ts';
			import intercept from '../../lib/evaluating/intercept/intercept.ts';
			import trace from '../../api/trace.ts';
			// api/debug.ts not yet implemented — stub so sandbox loads
			const debug = async (_code) => ({ ok: false, error: { kind: 'javascript', message: 'debug not yet implemented' } });

			// ─── Sample code ───────────────────────────────────────

			const SAMPLE_CODE = `// try hovering keywords, typing for completions
let greeting = 'hello';
const count = 42;

function add(a, b) {
\treturn a + b;
}

console.log(greeting, add(count, 8));
`;

			// ─── JeJ linter adapter ────────────────────────────────

			// Maps validate() results to LintDiagnostic[] for gutter markers.
			// All violations are severity: 'error' (red X) — they block execution.
			function lintWithJeJ(code) {
				const result = validate(code);

				// Parse error — syntax is invalid
				if (result.error && result.error.kind === 'parse') {
					return [
						{
							line: result.error.line || 1,
							column: result.error.column || 0,
							severity: 'error',
							message: result.error.message,
							source: 'JeJ parse',
						},
					];
				}

				// Validation rejections — valid JS but not valid JeJ
				if (result.rejections && result.rejections.length > 0) {
					return result.rejections.map(function todiagnostic(v) {
						return {
							line: v.location.start.line,
							column: v.location.start.column,
							endLine: v.location.end.line,
							endColumn: v.location.end.column,
							severity: 'error',
							message: v.message,
							source: 'JeJ',
						};
					});
				}

				return [];
			}

			// ─── Doc lookup (hardcoded — no JeJ equivalent) ────────

			function lookupDoc(word) {
				const docs = {
					let: {
						description:
							'Creates a block-scoped variable that can be reassigned',
						isJEJ: true,
						example: 'let age = 25;\nage = 26;',
						commonMistakes: [
							'Redeclaration: let x = 1; let x = 2; // Error!',
						],
						whenToUse: 'When you need a variable that might change',
					},
					const: {
						description:
							'Creates a block-scoped constant that cannot be reassigned',
						isJEJ: true,
						example: 'const name = "Alice";',
						whenToUse: 'When the value should never change',
					},
					function: {
						description: 'Declares a reusable block of code',
						isJEJ: false,
						example:
							'function greet(name) {\n\treturn "Hello, " + name;\n}',
						commonMistakes: [
							'Forgetting return statement',
							'Calling without parentheses',
						],
						whenToUse:
							'In modern JavaScript, when you need to reuse code',
						whyNotInJej:
							'A way to package some statements under a name so you can run them with different inputs. JEJ programs run as one flat sequence — defining your own functions opens up a new language level with a new notional machine.',
					},
					console: {
						description:
							'Browser/Node.js object for debugging and output',
						isJEJ: true,
						example: 'console.log("Hello!");',
						whenToUse:
							'For debugging and seeing what your code does',
					},
					return: {
						description:
							'Sends a value back from a function and exits',
						isJEJ: true,
						example: 'function add(a, b) {\n\treturn a + b;\n}',
						commonMistakes: ['Code after return never runs'],
						whenToUse: 'To send results back from functions',
					},
					if: {
						description:
							'Executes code only when a condition is true',
						isJEJ: true,
						example: 'if (age >= 18) {\n\tconsole.log("adult");\n}',
						commonMistakes: [
							'Using = instead of === in condition',
						],
						whenToUse:
							'When you need to make decisions in your code',
					},
					for: {
						description: 'Repeats code a specific number of times',
						isJEJ: true,
						example:
							'for (let i = 0; i < 5; i++) {\n\tconsole.log(i);\n}',
						commonMistakes: ['Off-by-one errors'],
						whenToUse:
							'When you know exactly how many times to repeat',
					},
				};
				return docs[word] || null;
			}

			// ─── Completions (hardcoded — no JeJ equivalent) ───────

			function getCompletions({ prefix }) {
				const builtins = [
					'console',
					'log',
					'error',
					'warn',
					'function',
					'return',
					'let',
					'const',
					'if',
					'else',
					'for',
					'while',
					'true',
					'false',
					'null',
					'undefined',
				];
				if (!prefix) return [];
				const lower = prefix.toLowerCase();
				const matches = builtins
					.filter(function matchPrefix(name) {
						return name.startsWith(lower);
					})
					.map(function toItem(name) {
						return { label: name, type: 'keyword' };
					});
				// Blocked-item demo: surface 'var' with tooltip + no-op apply.
				// Mirrors the lib/completing/ adapter's blocked-marker overlay so
				// the contract widening can be eyeballed end-to-end.
				const blockedDemo = 'var'.startsWith(lower)
					? [
							{
								label: 'var',
								type: 'blocked',
								detail: '(not in JEJ)',
								info: "'var' declarations are not allowed at this language level — use 'let' or 'const'.",
								apply: 'noop',
							},
						]
					: [];
				return [...matches, ...blockedDemo];
			}

			// ─── State ─────────────────────────────────────────────

			const containerEl = document.getElementById('editor-container');
			const statusEl = document.getElementById('status');
			const logEl = document.getElementById('log');
			const languageEl = document.getElementById('language');
			let currentEditor = null;
			let currentRun = null;

			function appendLog(cls, text) {
				logEl.style.display = 'block';
				const div = document.createElement('div');
				div.className = 'log-' + cls;
				div.textContent = text;
				logEl.appendChild(div);
				logEl.scrollTop = logEl.scrollHeight;
			}

			function clearLog() {
				logEl.innerHTML = '';
				logEl.style.display = 'none';
			}

			// ─── Create editor ──────────────────────────────────────

			async function makeEditor() {
				if (currentEditor) {
					currentEditor.destroy();
				}
				// WHY null between destroy() and await: during the async window,
				// button handlers guard with `if (!currentEditor) return;`. If we
				// left the destroyed sentinel in place, the guard would pass
				// (sentinel is truthy) and handlers would call no-op methods
				// silently — confusing dead-click UX. Nulling here makes the
				// guards work as intended until the new editor resolves.
				currentEditor = null;
				containerEl.innerHTML = '';

				const lang = languageEl.value;
				const isJS =
					lang === 'javascript' || lang === 'typescript';

				// TODO(phase-b): replace stub with embody(SAMPLE_CODE) once real parsing is wired in.
				// createEditor reads only embodiment.source.code; Phase A stub supplies just that.
				const sampleEmbodiment = { source: { code: SAMPLE_CODE } };
				currentEditor = await createEditor(/** @type {any} */ (sampleEmbodiment), {
					language: lang,
					parent: containerEl,
					...(isJS
						? {
								linters: [lintWithJeJ],
								docLookup: lookupDoc,
								completions: getCompletions,
								format: format,
								onFormat(result) {
									if (result.changed) {
										appendLog(
											'format',
											'formatted — changes applied',
										);
									} else {
										appendLog(
											'format',
											'formatted — no changes needed',
										);
									}
								},
							}
						: {}),
				});

				statusEl.textContent = `editor created (${lang})`;
				appendLog('info', `created editor with language: ${lang}`);
				if (isJS) {
					appendLog(
						'info',
						'callbacks: JeJ linter, docLookup, completions, JeJ format',
					);
				} else {
					appendLog('info', 'no callbacks (non-JS language)');
				}
			}

			// ─── Editor button handlers ─────────────────────────────

			document
				.getElementById('btn-format')
				.addEventListener('click', function onFormat() {
					if (!currentEditor) return;
					currentEditor.format();
				});

			document
				.getElementById('btn-reset')
				.addEventListener('click', function onReset() {
					if (!currentEditor) return;
					currentEditor.reset();
					appendLog('info', 'reset to initial code');
				});

			document
				.getElementById('btn-content')
				.addEventListener('click', function onGetContent() {
					if (!currentEditor) return;
					const content = currentEditor.content;
					appendLog(
						'content',
						`content (${content.length} chars):\n${content.substring(0, 300)}${content.length > 300 ? '...' : ''}`,
					);
				});

			document
				.getElementById('btn-destroy')
				.addEventListener('click', function onDestroy() {
					if (!currentEditor) return;
					currentEditor.destroy();
					currentEditor = null;
					statusEl.textContent = 'editor destroyed';
					appendLog(
						'warn',
						'destroyed — click [recreate] to make a new one',
					);
				});

			document
				.getElementById('btn-recreate')
				.addEventListener('click', async function onRecreate() {
					clearLog();
					await makeEditor();
				});

			languageEl.addEventListener(
				'change',
				async function onLanguageChange() {
					clearLog();
					await makeEditor();
				},
			);

			// ─── JeJ execution button handlers ─────────────────────

			document
				.getElementById('btn-validate')
				.addEventListener('click', function onValidate() {
					if (!currentEditor) return;
					const code = currentEditor.content;
					const result = validate(code);

					if (result.ok) {
						appendLog('info', 'validate: ok — valid JeJ');
					} else if (result.error) {
						appendLog(
							'error',
							`validate: ${result.error.kind} error — ${result.error.message}`,
						);
					}

					if (result.rejections && result.rejections.length > 0) {
						appendLog(
							'error',
							`validate: ${result.rejections.length} rejection(s)`,
						);
						for (const v of result.rejections) {
							appendLog(
								'error',
								`  [${v.location.start.line}:${v.location.start.column}] ${v.message}`,
							);
						}
					}
				});

			document
				.getElementById('btn-run')
				.addEventListener('click', async function onRun() {
					if (!currentEditor) return;

					// Cancel in-progress run
					if (currentRun) {
						currentRun.cancel();
						return;
					}

					const code = currentEditor.content;
					const btn = document.getElementById('btn-run');
					btn.textContent = '[cancel]';
					appendLog('info', 'running...');

					const gen = intercept(code, { seconds: 5 });
					currentRun = gen;

					try {
						for await (const event of gen) {
							console.log('[run event]', event);
							appendLog('event', renderInterceptEvent(event));
						}
						const result = await gen.result;
						console.log('[run result]', result.logs);

						if (!result.ok) {
							if (result.error) {
								appendLog(
									'error',
									`run error (${result.error.kind}): ${result.error.message}`,
								);
							}
							if (result.rejections && result.rejections.length > 0) {
								appendLog(
									'error',
									`run: ${result.rejections.length} rejection(s) — code is not valid JeJ`,
								);
							}
						} else {
							appendLog(
								'info',
								`run: ${result.logs.length} event(s)`,
							);
						}
					} catch (err) {
						appendLog('error', `run threw: ${err.message}`);
					} finally {
						currentRun = null;
						btn.textContent = '[run]';
						btn.disabled = false;
					}
				});

			document
				.getElementById('btn-trace')
				.addEventListener('click', async function onTrace() {
					if (!currentEditor) return;
					const code = currentEditor.content;
					const btn = document.getElementById('btn-trace');
					btn.disabled = true;
					appendLog('info', 'tracing...');

					try {
						const result = await trace(code, { seconds: 5 });

						if (!result.ok) {
							if (result.error) {
								appendLog(
									'error',
									`trace error (${result.error.kind}): ${result.error.message}`,
								);
							}
							if (result.rejections && result.rejections.length > 0) {
								appendLog(
									'error',
									`trace: ${result.rejections.length} rejection(s)`,
								);
							}
						}

						if (result.logs) {
							appendLog(
								'info',
								`trace: ${result.logs.length} step(s) — see console for details`,
							);
							console.log('TraceResult:', result);
						}
					} catch (err) {
						appendLog('error', `trace threw: ${err.message}`);
					} finally {
						btn.disabled = false;
					}
				});

			document
				.getElementById('btn-debug')
				.addEventListener('click', async function onDebug() {
					if (!currentEditor) return;
					const code = currentEditor.content;
					const btn = document.getElementById('btn-debug');
					btn.disabled = true;
					appendLog(
						'info',
						'debugging — open DevTools before this runs!',
					);

					try {
						const result = await debug(code);

						if (!result.ok) {
							if (result.error) {
								appendLog(
									'error',
									`debug error (${result.error.kind}): ${result.error.message}`,
								);
							}
							if (result.rejections && result.rejections.length > 0) {
								appendLog(
									'error',
									`debug: ${result.rejections.length} rejection(s)`,
								);
							}
						} else {
							appendLog('info', 'debug: completed');
						}
					} catch (err) {
						appendLog('error', `debug threw: ${err.message}`);
					} finally {
						btn.disabled = false;
					}
				});

			// ─── Helpers ────────────────────────────────────────────

			function renderInterceptEvent(event) {
				if (event.event === 'log') {
					return `  [line ${event.line}] log: ${event.args.map(String).join(', ')}`;
				}
				if (event.event === 'error') {
					return `  [${event.phase}] ${event.name}: ${event.message}${event.line ? ' (line ' + event.line + ')' : ''}`;
				}
				if (event.event === 'prompt') {
					return `  [line ${event.line}] prompt(${event.args.map(String).join(', ')}) → ${JSON.stringify(event.return)}`;
				}
				if (event.event === 'confirm') {
					return `  [line ${event.line}] confirm(${event.args.map(String).join(', ')}) → ${event.return}`;
				}
				if (event.event === 'alert') {
					return `  [line ${event.line}] alert(${event.args.map(String).join(', ')})`;
				}
				if (event.event === 'assert') {
					return `  [line ${event.line}] assert: ${event.args.map(String).join(', ')}`;
				}
				return `  ${JSON.stringify(event)}`;
			}

			// ─── Init ───────────────────────────────────────────────

			makeEditor().catch(function onInitError(err) {
				statusEl.textContent = 'init failed: ' + (err && err.message || err);
				statusEl.style.color = '#f48771';
				console.error('makeEditor startup rejected:', err);
			});

			// SAB availability check for run/trace
			if (typeof SharedArrayBuffer === 'undefined') {
				statusEl.textContent +=
					' | SharedArrayBuffer not available — run/trace may not work';
				statusEl.style.color = '#f48771';
			}
		</script>
	</body>
</html>
