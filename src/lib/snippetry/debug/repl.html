<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Worker REPL</title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			body {
				font-family: monospace;
				padding: 2rem;
				max-width: 700px;
				margin: 0 auto;
			}
			h1 {
				font-size: 1.2rem;
				margin-bottom: 1rem;
			}
			textarea {
				width: 100%;
				height: 200px;
				font-family: monospace;
				font-size: 14px;
				padding: 0.5rem;
				tab-size: 2;
				border: 2px solid #333;
				resize: vertical;
			}
			button {
				margin-top: 0.5rem;
				padding: 0.5rem 1.5rem;
				font-family: monospace;
				font-size: 14px;
				cursor: pointer;
				border: 2px solid #333;
				background: #eee;
			}
			button:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}
			#output {
				margin-top: 1rem;
				padding: 0.75rem;
				border: 2px solid #ccc;
				background: #f9f9f9;
				font-size: 13px;
				white-space: pre-wrap;
				min-height: 2rem;
			}
			#output.error {
				border-color: #c00;
				color: #c00;
			}
		</style>
	</head>
	<body>
		<h1>Worker REPL</h1>
		<textarea id="code">1 + 1</textarea>
		<button id="run">[run in worker]</button>
		<pre id="output"></pre>

		<script>
			const WORKER_CODE = `
        self.onmessage = function(e) {
          try {
            const result = eval(e.data);
            self.postMessage({ type: 'result', value: String(result) });
          } catch (err) {
            self.postMessage({ type: 'error', message: err.message });
          }
        };
      `;

			function runInWorker(code) {
				return new Promise((resolve, reject) => {
					const blob = new Blob([WORKER_CODE], {
						type: 'application/javascript',
					});
					const url = URL.createObjectURL(blob);
					const worker = new Worker(url);

					worker.onmessage = (e) => {
						URL.revokeObjectURL(url);
						worker.terminate();
						if (e.data.type === 'error') reject(new Error(e.data.message));
						else resolve(e.data.value);
					};

					worker.onerror = (e) => {
						URL.revokeObjectURL(url);
						worker.terminate();
						reject(new Error(e.message));
					};

					worker.postMessage(code);
				});
			}

			const codeEl = document.getElementById('code');
			const runBtn = document.getElementById('run');
			const outputEl = document.getElementById('output');

			runBtn.addEventListener('click', async () => {
				runBtn.disabled = true;
				outputEl.className = '';
				outputEl.textContent = 'running…';
				try {
					const result = await runInWorker(codeEl.value);
					outputEl.textContent = result;
				} catch (err) {
					outputEl.className = 'error';
					outputEl.textContent = err.message;
				} finally {
					runBtn.disabled = false;
				}
			});
		</script>
	</body>
</html>
