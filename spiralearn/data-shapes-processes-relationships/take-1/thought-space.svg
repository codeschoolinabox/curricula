<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="tsT tsD">
  <title id="tsT">What can be said: notations as regions, data thoughts as points</title>
  <desc id="tsD">Two overlapping ellipses on a field of data thoughts. The left is the range of thoughts expressible in code; the right the range expressible in mathematical notation. The lens-shaped overlap holds thoughts both can carry. Each crescent holds a thought only one of them can carry, and those are marked as where the lessons are. A note records that the checking loop is the same everywhere on the field.</desc>
  <style>
    :root { color-scheme: light dark; }
    .ink { fill: #14181d; }
    .muted { fill: #5b6a6d; }
    .tag { fill: #8b989a; }
    .edge { stroke: #14181d; fill: none; }
    .lens { fill: #2c5f5a; }
    .holds { fill: #2c5f5a; }
    .absent { fill: #a03e2f; }
    .absentline { stroke: #a03e2f; fill: none; }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 13px; font-weight: 640; }
    .s { font-size: 11px; }
    .t { font-size: 10px; }
    .g { font-size: 10px; letter-spacing: .12em; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e7ebeb; }
      .muted { fill: #9daaac; }
      .tag { fill: #6d7b7d; }
      .edge { stroke: #e7ebeb; }
      .lens { fill: #6fb5ac; }
      .holds { fill: #6fb5ac; }
      .absent { fill: #e08670; }
      .absentline { stroke: #e08670; }
    }
  </style>

  <text x="320" y="26" text-anchor="middle" class="g tag">THE FIELD OF DATA THOUGHTS</text>

  <path d="M320 76.7 A165 92 0 0 0 320 243.3 A165 92 0 0 1 320 76.7 Z" class="lens" opacity="0.13"/>
  <ellipse cx="250" cy="160" rx="165" ry="92" class="edge" stroke-width="1.5"/>
  <ellipse cx="390" cy="160" rx="165" ry="92" class="edge" stroke-width="1.5"/>

  <text x="140" y="118" text-anchor="middle" class="h ink">code</text>
  <text x="500" y="118" text-anchor="middle" class="h ink">mathematical notation</text>

  <circle cx="320" cy="150" r="4" class="holds"/>
  <text x="320" y="141" text-anchor="middle" class="s holds">balanced parens</text>
  <circle cx="320" cy="182" r="4" class="holds"/>
  <text x="320" y="200" text-anchor="middle" class="s holds">start is before end</text>

  <circle cx="148" cy="166" r="4" class="absent"/>
  <text x="148" y="157" text-anchor="middle" class="s absent">a running total</text>
  <text x="148" y="184" text-anchor="middle" class="t muted">after step n</text>

  <circle cx="492" cy="166" r="4" class="absent"/>
  <text x="492" y="157" text-anchor="middle" class="s absent">the limit of a series</text>

  <path d="M148 196 L148 268" class="absentline" stroke-width="1.3" stroke-dasharray="4 4"/>
  <path d="M492 178 L492 268" class="absentline" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="320" y="286" text-anchor="middle" class="s absent">the crescents are the lessons &#8212; what one notation cannot hold</text>

  <path d="M320 252 L320 300" class="edge" stroke-width="1.2"/>
  <text x="320" y="318" text-anchor="middle" class="s muted">the checking loop is the same across the whole field; the thoughts are not</text>
  <text x="320" y="334" text-anchor="middle" class="t tag">NOTATIONS ARE REGIONS · DATA THOUGHTS ARE POINTS</text>
</svg>
