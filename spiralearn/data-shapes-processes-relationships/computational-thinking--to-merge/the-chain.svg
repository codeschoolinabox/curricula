<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" width="1120" height="440" role="img" aria-labelledby="ctl cds">
  <title id="ctl">The F-side: from a physical process to the study of formal structures</title>
  <desc id="cds">A row of positions. At the far left the artifact, a physical process. Then notional machines — the dynamic account of what the code does while running — marked as yours to twin. Beneath them a ladder of language levels they can be built for: machine code, assembly, C++, JavaScript, with JavaScript picked out because that is the level Just Enough JavaScript models. Then code, the static instructions at rest, ringed as the position a practitioner learns to delegate. A dashed pivot divides these, which cause the process, from what lies right of it, which describes it: the computational thoughts held by a person, pseudocode, formal notation, and CS or theory set apart as a discipline whose objects are the other positions. Underneath, a row giving what each position can be checked against; pseudocode has nothing, and no machine can be built for it. The right-hand side is not yet layered.</desc>
  <style>
    :root { color-scheme: light dark; }
    .ink { fill: #14181d; }
    .muted { fill: #5b6672; }
    .line { stroke: #9aa5b1; }
    .box { fill: #ffffff; stroke: #14181d; }
    .soft { fill: #ffffff; stroke: #9aa5b1; }
    .accent { stroke: #b4530a; }
    .accentfill { fill: #b4530a; }
    .accenttag { fill: #b4530a; font-weight: 640; }
    .tag { fill: #6b7683; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e8ecf1; }
      .muted { fill: #9aa5b1; }
      .line { stroke: #55606c; }
      .box { fill: #14181d; stroke: #e8ecf1; }
      .soft { fill: #14181d; stroke: #55606c; }
      .accent { stroke: #e8913f; }
      .accentfill { fill: #e8913f; }
      .accenttag { fill: #e8913f; }
      .tag { fill: #8792a0; }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 15px; font-weight: 640; }
    .s { font-size: 11px; }
    .t { font-size: 10px; }
    .g { font-size: 10.5px; letter-spacing: .05em; }
    .k { font-size: 11.5px; font-style: italic; }
  </style>
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="accentfill"/>
    </marker>
  </defs>

  <text x="240" y="30" text-anchor="middle" class="g tag">STATIC &#8594; DYNAMIC &#8594; PHYSICAL</text>

  <rect x="18" y="56" width="126" height="80" rx="10" class="box" stroke-width="1.6"/>
  <text x="81" y="88" text-anchor="middle" class="h ink">the artifact</text>
  <text x="81" y="110" text-anchor="middle" class="s muted">a physical process</text>

  <rect x="176" y="56" width="150" height="80" rx="10" class="box" stroke-width="1.6"/>
  <text x="251" y="84" text-anchor="middle" class="h ink">notional machines</text>
  <text x="251" y="104" text-anchor="middle" class="s muted">dynamic — what the code</text>
  <text x="251" y="118" text-anchor="middle" class="s muted">does while it runs</text>
  <text x="251" y="156" text-anchor="middle" class="g accenttag">YOURS TO TWIN</text>

  <rect x="358" y="46" width="146" height="100" rx="14" fill="none" class="accent" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="366" y="56" width="130" height="80" rx="10" class="box" stroke-width="1.6"/>
  <text x="431" y="88" text-anchor="middle" class="h ink">code</text>
  <text x="431" y="110" text-anchor="middle" class="s muted">static — instructions</text>
  <text x="431" y="124" text-anchor="middle" class="s muted">at rest</text>
  <text x="431" y="166" text-anchor="middle" class="g accenttag">THE DELEGABLE POSITION</text>

  <path d="M144 96 L174 96" class="line" stroke-width="1.4"/>
  <path d="M326 96 L364 96" class="line" stroke-width="1.4"/>

  <!-- language ladder: what the notional machines can be built for -->
  <path d="M251 136 L251 210" class="line" fill="none" stroke-width="1.1" stroke-dasharray="3 4"/>
  <text x="251" y="230" text-anchor="middle" class="t tag">ONE PER LANGUAGE LEVEL — YOU CHOOSE WHICH TO MODEL</text>
  <rect x="60" y="244" width="88" height="34" rx="7" class="soft" stroke-width="1.2"/>
  <text x="104" y="266" text-anchor="middle" class="s ink">machine code</text>
  <rect x="156" y="244" width="88" height="34" rx="7" class="soft" stroke-width="1.2"/>
  <text x="200" y="266" text-anchor="middle" class="s ink">assembly</text>
  <rect x="252" y="244" width="88" height="34" rx="7" class="soft" stroke-width="1.2"/>
  <text x="296" y="266" text-anchor="middle" class="s ink">C++</text>
  <rect x="348" y="244" width="94" height="34" rx="7" class="box" stroke-width="1.8" style="stroke:#b4530a"/>
  <text x="395" y="266" text-anchor="middle" class="s ink">JavaScript</text>
  <path d="M148 261 L154 261" class="line" stroke-width="1.2"/>
  <path d="M244 261 L250 261" class="line" stroke-width="1.2"/>
  <path d="M340 261 L346 261" class="line" stroke-width="1.2"/>
  <text x="251" y="298" text-anchor="middle" class="g accenttag">JEJ MODELS THIS ONE — STUDY LENSES MAKES IT CHECKABLE</text>

  <path d="M534 34 L534 200" class="line" fill="none" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="522" y="40" text-anchor="end" class="k muted">these cause the process</text>
  <text x="546" y="40" class="k muted">these describe it</text>
  <path d="M504 96 L532 96" class="line" stroke-width="1.4"/>

  <rect x="548" y="56" width="124" height="80" rx="10" class="box" stroke-width="1.6"/>
  <text x="610" y="82" text-anchor="middle" class="h ink">the computational</text>
  <text x="610" y="100" text-anchor="middle" class="h ink">thoughts</text>
  <text x="610" y="120" text-anchor="middle" class="s muted">held by a person</text>

  <rect x="688" y="56" width="120" height="80" rx="10" class="box" stroke-width="1.6"/>
  <text x="748" y="90" text-anchor="middle" class="h ink">pseudocode</text>
  <text x="748" y="112" text-anchor="middle" class="s muted">no machine can be built</text>

  <rect x="824" y="56" width="120" height="80" rx="10" class="box" stroke-width="1.6"/>
  <text x="884" y="90" text-anchor="middle" class="h ink">formal notation</text>
  <text x="884" y="112" text-anchor="middle" class="s muted">proof assistants run it</text>

  <rect x="960" y="56" width="56" height="80" rx="10" class="soft" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="988" y="90" text-anchor="middle" class="h ink">CS /</text>
  <text x="988" y="108" text-anchor="middle" class="h ink">theory</text>

  <path d="M672 96 L686 96" class="line" stroke-width="1.4"/>
  <path d="M808 96 L822 96" class="line" stroke-width="1.4"/>
  <path d="M944 96 L958 96" class="line" stroke-width="1.4" stroke-dasharray="4 3"/>

  <text x="800" y="196" text-anchor="middle" class="g tag">NOT YET LAYERED</text>

  <text x="540" y="356" text-anchor="middle" class="g tag">WHAT YOU CAN CHECK IT AGAINST</text>
  <path d="M18 370 L1096 370" class="line" fill="none" stroke-width="1" opacity=".5"/>
  <text x="81" y="394" text-anchor="middle" class="s muted">measurement</text>
  <text x="251" y="394" text-anchor="middle" class="s muted">the running machine,</text>
  <text x="251" y="408" text-anchor="middle" class="s muted">via Study Lenses</text>
  <text x="431" y="394" text-anchor="middle" class="s muted">the interpreter — on what it</text>
  <text x="431" y="408" text-anchor="middle" class="s muted">means, not whether you meant it</text>
  <text x="610" y="394" text-anchor="middle" class="s muted">nothing directly — hence</text>
  <text x="610" y="408" text-anchor="middle" class="s muted">the twin, hence the instruments</text>
  <text x="748" y="396" text-anchor="middle" class="h accenttag">nothing</text>
  <text x="884" y="394" text-anchor="middle" class="s muted">proof</text>
  <text x="988" y="394" text-anchor="middle" class="s muted">proof, and</text>
  <text x="988" y="408" text-anchor="middle" class="s muted">measurement</text>
</svg>
