<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 712" width="880" height="712" role="img"
  aria-labelledby="ttl dsc">
  <title id="ttl">A computation, and its three representations</title>
  <desc id="dsc">At the centre: a computation — a physical process taking place in the world. Around
    it, three representations of that process. The apex is one corner with two faces: the idea
    (cognitive) and the algorithm (formal). The lower-left corner is the notional machine, at an
    intentional, calibrated level of abstraction and detail. The lower-right corner is the
    programming language — source code, blocks, or flowcharts. Edges read "embodied by", "expressed
    through", and "syntax and semantics", the last drawn as an arrow from the programming language
    to the notional machine because semantics maps notation onto machine behaviour; that edge is
    definitional, not causal. Each corner is tagged with the
    instrument that makes it legible; the idea corner has none yet. The programming language corner
    is ringed in the accent colour to mark it as the part a practitioner learns to delegate to an
    LLM — and it is also the only corner with causal power over the machine, which it exerts through layers of implementation rather than along the labelled edge; those layers are drawn in the-stack.svg.</desc>
  <style>
    :root { color-scheme: light dark; }
    .ink   { fill: #14181d; }
    .muted { fill: #5b6672; }
    .line  { stroke: #9aa5b1; }
    .box   { fill: #ffffff; stroke: #14181d; }
    .core  { fill: #ffffff; stroke: #9aa5b1; }
    .accent{ stroke: #b4530a; }
    .accentfill { fill: #b4530a; }
    .tag   { fill: #6b7683; }
    .accenttag { fill: #b4530a; font-weight: 640; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e8ecf1; }
      .muted { fill: #9aa5b1; }
      .line  { stroke: #55606c; }
      .box   { fill: #14181d; stroke: #e8ecf1; }
      .core  { fill: #14181d; stroke: #55606c; }
      .accent{ stroke: #e8913f; }
      .accentfill { fill: #e8913f; }
      .tag   { fill: #8792a0; }
      .accenttag { fill: #e8913f; }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 20px; font-weight: 640; }
    .s { font-size: 13.5px; }
    .e { font-size: 16px; font-style: italic; }
    .c { font-size: 20px; font-weight: 640; letter-spacing: .02em; }
    .g { font-size: 12px; letter-spacing: .06em; }
  </style>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
      orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="accentfill" />
    </marker>
  </defs>

  <path d="M440 146 L155 452" class="line" fill="none" stroke-width="1.6" />
  <path d="M440 146 L725 452" class="line" fill="none" stroke-width="1.6" />
  <path d="M578 497 L302 497" class="accent" fill="none" stroke-width="2.2" marker-end="url(#arw)" />

  <path d="M440 146 L440 300" class="line" fill="none" stroke-width="1" stroke-dasharray="2 5"
    opacity=".6" />
  <path d="M178 448 L342 380" class="line" fill="none" stroke-width="1" stroke-dasharray="2 5"
    opacity=".6" />
  <path d="M702 448 L538 380" class="line" fill="none" stroke-width="1" stroke-dasharray="2 5"
    opacity=".6" />

  <rect x="308" y="300" width="264" height="96" rx="30" class="core" stroke-width="1.3"
    stroke-dasharray="5 4" />
  <text x="440" y="325" text-anchor="middle" class="g tag">WHAT ALL THREE REPRESENT</text>
  <text x="440" y="353" text-anchor="middle" class="c ink">a computation</text>
  <text x="440" y="377" text-anchor="middle" class="s muted">a physical process taking place in the
    world</text>

  <text x="205" y="256" text-anchor="middle" class="e muted">dynamically understood using</text>
  <text x="676" y="256" text-anchor="middle" class="e muted">statically expressed by</text>
  <text x="440" y="521" text-anchor="middle" class="e muted">syntax &amp; semantics</text>
  <text x="440" y="540" text-anchor="middle" class="s muted">what the notation means</text>

  <text x="440" y="30" text-anchor="middle" class="g tag">NO INSTRUMENT YET — THIS IS THE HALF-BEAT</text>
  <rect x="265" y="58" width="350" height="88" rx="12" class="box" stroke-width="1.6" />
  <line x1="440" y1="58" x2="440" y2="146" class="line" stroke-width="1.2" stroke-dasharray="4 4" />
  <text x="352" y="95" text-anchor="middle" class="h ink">the idea</text>
  <text x="352" y="119" text-anchor="middle" class="s muted">cognitive</text>
  <text x="528" y="95" text-anchor="middle" class="h ink">the algorithm</text>
  <text x="528" y="119" text-anchor="middle" class="s muted">formal</text>

  <rect x="18" y="452" width="284" height="92" rx="12" class="box" stroke-width="1.6" />
  <text x="160" y="484" text-anchor="middle" class="h ink">the notional machine</text>
  <text x="160" y="506" text-anchor="middle" class="s muted">what runs it — at an intentional,</text>
  <text x="160" y="525" text-anchor="middle" class="s muted">calibrated level of abstraction</text>
  <text x="160" y="572" text-anchor="middle" class="g tag">STUDY LENSES · EMBODY</text>

  <rect x="570" y="444" width="300" height="108" rx="18" fill="none" class="accent"
    stroke-width="2.2" stroke-dasharray="7 5" />
  <rect x="578" y="452" width="284" height="92" rx="12" class="box" stroke-width="1.6" />
  <text x="720" y="484" text-anchor="middle" class="h ink">the programming language</text>
  <text x="720" y="506" text-anchor="middle" class="s muted">instructions for a NM — source code,</text>
  <text x="720" y="525" text-anchor="middle" class="s muted">blocks, flowcharts…</text>
  <text x="720" y="576" text-anchor="middle" class="g tag">JUST ENOUGH JAVASCRIPT</text>
  <text x="720" y="598" text-anchor="middle" class="g accenttag">THE DELEGABLE CORNER</text>

  <text x="440" y="646" text-anchor="middle" class="s muted">Small caps name the instrument that
    makes each corner legible.</text>
  <text x="440" y="668" text-anchor="middle" class="s muted">You learn to delegate the ringed corner — and it is the only one with causal power over the machine.</text>
  <text x="440" y="688" text-anchor="middle" class="s muted">It causes through layers of implementation, not along this edge — see the-stack.svg.</text>
</svg>
